name: Cross-platform version consistency

on:
  pull_request:
  push:
    branches: [main, feature/android-standalone, feature/android-v2.2-paywall, v2.0.0]

jobs:
  verify-version-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate shared semantic version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid VERSION: $version"
            exit 1
          }
      - name: Verify Android consumes VERSION
        shell: bash
        run: |
          grep -F 'rootProject.file("../VERSION").readText().trim()' android/app/build.gradle.kts
          grep -F 'Get-Content ../VERSION' .github/workflows/android-build.yml
      - name: Verify Windows consumes VERSION
        shell: bash
        run: |
          grep -F 'Get-Content VERSION' .github/workflows/windows-build.yml
          if grep -Eq "version = '[0-9]+\.[0-9]+\.[0-9]+'" .github/workflows/windows-build.yml; then
            echo "Windows workflow contains a hard-coded release version"
            exit 1
          fi
      - name: Record synchronized release identity
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          printf '{"version":"%s","commit":"%s"}\n' "$version" "$GITHUB_SHA" > synchronized-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: synchronized-release-identity
          path: synchronized-release.json
