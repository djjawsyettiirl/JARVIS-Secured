name: Android build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, v0.1-secure-pairing]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle.properties
      - name: Restore private Android signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('jarvis-release.jks', [Convert]::FromBase64String('${{ secrets.JARVIS_ANDROID_KEYSTORE_B64 }}'))
      - name: Build signed private APK
        env:
          JARVIS_BUILD_NUMBER: ${{ github.run_number }}
          JARVIS_KEYSTORE_PATH: ${{ github.workspace }}/android/jarvis-release.jks
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_ANDROID_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_ANDROID_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Stamp Android build identity
        shell: pwsh
        run: |
          @{
            version = '1.8.2'
            version_code = 1802000 + [int]'${{ github.run_number }}'
            commit = '${{ github.sha }}'
            run_id = '${{ github.run_id }}'
          } | ConvertTo-Json | Set-Content app/build/outputs/apk/release/android-build.json
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/android-build.json
          if-no-files-found: error
