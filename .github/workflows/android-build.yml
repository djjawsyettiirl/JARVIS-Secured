name: Android build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, v0.1-secure-pairing, v2.0.0]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle.properties
      - name: Restore private Android signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('jarvis-release.jks', [Convert]::FromBase64String('${{ secrets.JARVIS_ANDROID_KEYSTORE_B64 }}'))
      - name: Test and lint Android app
        run: gradle test lint --no-daemon --stacktrace
      - name: Build signed APKs and Play bundle
        env:
          JARVIS_BUILD_NUMBER: ${{ github.run_number }}
          JARVIS_KEYSTORE_PATH: ${{ github.workspace }}/android/jarvis-release.jks
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_ANDROID_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_ANDROID_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_ANDROID_KEY_PASSWORD }}
        run: gradle assembleDirectRelease --no-daemon --stacktrace
      - name: Stamp Android build identity
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content ../VERSION -Raw).Trim()
          @{
            version = $releaseVersion
            version_code = 2000000 + [int]'${{ github.run_number }}'
            commit = '${{ github.sha }}'
            run_id = '${{ github.run_id }}'
          } | ConvertTo-Json | Set-Content android-build.json
      - name: Upload Android release packages
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-release
          path: |
            android/app/build/outputs/apk/direct/release/app-direct-release.apk
            android/android-build.json
          if-no-files-found: error
      - name: Prepare Windows companion update
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path companion-update | Out-Null
          Copy-Item app/build/outputs/apk/direct/release/app-direct-release.apk companion-update/app-release.apk
          Copy-Item android-build.json companion-update/android-build.json
      - name: Upload Windows companion update
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: android/companion-update/*
          if-no-files-found: error
