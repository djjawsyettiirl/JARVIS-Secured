name: Windows host build

on:
  workflow_dispatch:
  push:
    branches: [main, v0.1-secure-pairing]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host dependencies
        run: python -m pip install --upgrade pip && pip install -r host/requirements.txt pyinstaller
      - name: Download Cloudflare tunnel client
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' `
            -OutFile 'host/cloudflared.exe'
      - name: Stamp private build identity
        shell: pwsh
        run: |
          @{ version = '0.4.0'; commit = '${{ github.sha }}' } | ConvertTo-Json | Set-Content host/build-info.json
      - name: Build Windows host executable
        run: pyinstaller --noconfirm --clean --onefile --console --name JARVIS-Host --paths host --collect-all uvicorn --collect-all fastapi --collect-all googleapiclient --collect-all google_auth_oauthlib --collect-all keyring --add-binary "host/cloudflared.exe;." --add-data "host/build-info.json;." host/run_host.py
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/JARVIS-Host.exe package/JARVIS-Host.exe
          @'
          JARVIS Secure Host v0.4.0

          Run JARVIS-Host.exe. Keep the console window open while JARVIS is running.
          Then open http://127.0.0.1:8766 for the local dashboard.
          The secure gateway listens on TCP 8765.

          This build intentionally keeps a console attached so Uvicorn logging has
          a valid stdout stream and can start reliably on Windows.

          The bundled Cloudflare Quick Tunnel starts automatically. Its temporary
          HTTPS address appears in the dashboard. Do not expose the local admin
          dashboard (8766) publicly.
          '@ | Set-Content package/README.txt
          Compress-Archive -Path package/* -DestinationPath JARVIS-Windows-Host.zip -Force
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-host
          path: JARVIS-Windows-Host.zip
          if-no-files-found: error
