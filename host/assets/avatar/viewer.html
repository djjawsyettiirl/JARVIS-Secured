<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}body:before{content:"";position:absolute;inset:12% 10% 2%;border-radius:50%;background:radial-gradient(circle,#36d9ff26 0,transparent 66%);filter:blur(12px);animation:pulse 3s ease-in-out infinite}canvas{width:100%;height:100%;display:block;opacity:0;transition:opacity .5s}body.loaded canvas{opacity:1}#avatarStatus{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font:700 10px "Segoe UI",sans-serif;letter-spacing:.18em;color:#7de7ff;background:#07101dbd;border:1px solid #287992;padding:6px 10px;border-radius:999px;white-space:nowrap}body[data-state=listening] #avatarStatus{color:#9dffdc;border-color:#3ad99f}body[data-state=thinking] #avatarStatus{color:#ffd689;border-color:#b9852d}body[data-state=speaking] #avatarStatus{color:#ff9db3;border-color:#d94b6e}@keyframes pulse{50%{transform:scale(1.06);opacity:.7}}
</style></head><body data-state="idle"><canvas id="avatarCanvas"></canvas><div id="avatarStatus">LOADING MODEL</div><script src="viewer.js"></script></body></html>
